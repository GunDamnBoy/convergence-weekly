<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23C8102E'/%3E%3Cpath d='M8 21 L14 12 L18 17 L24 9' stroke='white' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<title>主題匯流訊號報</title>
<style>
:root{
  --red:#C8102E; --red-d:#8E0B20; --red-l:#FBEAED; --red-line:#C8102E;
  --ink:#1A1A1A; --mid:#555; --lite:#8C8C8C;
  --line:#E4E4E4; --bg:#fff; --soft:#F7F7F8; --track:#EFEFF1;
  --warn-bg:#FFF9E6; --warn-bd:#F0D48A; --warn-ink:#6B5416;
}
@media (prefers-color-scheme: dark){
  :root{
    --red:#F2778C; --red-d:#F7A3B2; --red-l:#2A1218; --red-line:#F2778C;
    --ink:#ECECEC; --mid:#B4B4B4; --lite:#8A8A8A;
    --line:#333; --bg:#141416; --soft:#1D1D20; --track:#2A2A2E;
    --warn-bg:#241E0C; --warn-bd:#5C4A18; --warn-ink:#E0C77A;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  line-height:1.75;-webkit-text-size-adjust:100%}
.wrap{max-width:880px;margin:0 auto;padding:0 20px 80px}
a{color:var(--red)}

/* header */
header{border-bottom:3px solid var(--red-line);padding:34px 0 18px;margin-bottom:22px}
.kicker{color:var(--red);font-weight:700;letter-spacing:.14em;font-size:12px}
h1{font-size:28px;line-height:1.36;margin:10px 0 10px;font-weight:800;letter-spacing:-.01em}
.meta{color:var(--lite);font-size:13px}
.meta b{color:var(--mid);font-weight:600}
.srcs{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.srcs span{font-size:11.5px;border:1px solid var(--line);border-radius:99px;
  padding:3px 11px;color:var(--mid);background:var(--soft)}

/* issue switcher */
.switch{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 26px}
.switch .lbl{font-size:11.5px;letter-spacing:.09em;color:var(--lite);
  font-weight:700;margin-right:2px}
.switch button{font:inherit;font-size:13px;padding:5px 13px;border-radius:99px;cursor:pointer;
  border:1px solid var(--line);background:var(--bg);color:var(--mid);
  font-variant-numeric:tabular-nums}
.switch button:hover{border-color:var(--red);color:var(--red)}
.switch button[aria-current="true"]{background:var(--red);border-color:var(--red);color:#fff;font-weight:700}

/* verdict */
.verdict{background:var(--red-l);border-left:5px solid var(--red-line);
  padding:20px 22px;margin:0 0 12px;border-radius:0 6px 6px 0}
.verdict h2{margin:0 0 10px;font-size:15px;color:var(--red-d);letter-spacing:.06em}
.verdict p{margin:0 0 11px;font-size:16px}
.verdict p:last-child{margin-bottom:0}

h2.sec{font-size:13px;letter-spacing:.12em;color:var(--red);
  border-top:1px solid var(--line);padding-top:26px;margin:46px 0 6px;font-weight:700}
h2.sec + .lede{color:var(--mid);font-size:14px;margin:0 0 22px}

.item{border:1px solid var(--line);border-radius:8px;padding:20px 22px;margin-bottom:18px}
.item.hot{border-color:var(--red-line);border-width:1.5px}
.tagrow{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:11px;align-items:center}
.tag{font-size:11px;font-weight:700;letter-spacing:.05em;padding:3px 9px;border-radius:99px;
  background:var(--soft);color:var(--mid);border:1px solid var(--line)}
.tag.r{background:var(--red);color:#fff;border-color:var(--red)}
.tag.o{background:transparent;color:var(--red);border-color:var(--red)}
.item h3{margin:0 0 10px;font-size:19px;line-height:1.45;font-weight:700}
.item p{margin:0 0 12px;font-size:15.5px}
.item p:last-child{margin-bottom:0}

.cols{display:grid;border:1px solid var(--line);border-radius:6px;overflow:hidden;margin:14px 0}
.cols.n3{grid-template-columns:repeat(3,1fr)}
.cols.n2{grid-template-columns:repeat(2,1fr)}
.cols > div{padding:13px 15px;font-size:13.8px;border-right:1px solid var(--line)}
.cols > div:last-child{border-right:0}
.cols h4{margin:0 0 6px;font-size:10.5px;letter-spacing:.09em;color:var(--red);font-weight:700}
@media(max-width:640px){
  .cols.n3,.cols.n2{grid-template-columns:1fr}
  .cols > div{border-right:0;border-bottom:1px solid var(--line)}
  .cols > div:last-child{border-bottom:0}
}

.ev{margin:12px 0 0;padding:12px 15px;background:var(--soft);border-radius:6px;
  font-size:13px;color:var(--mid);line-height:1.7}
.ev b.h{display:block;font-size:10.5px;letter-spacing:.08em;margin-bottom:6px;
  color:var(--lite);font-weight:700}
.ev div{margin-bottom:4px}
.ev div:last-child{margin-bottom:0}
.d{color:var(--red);font-weight:600;font-variant-numeric:tabular-nums}
.sb{display:inline-block;font-size:10.5px;border:1px solid var(--line);border-radius:3px;
  padding:0 5px;margin:0 5px 0 2px;color:var(--lite)}

.call{border-top:2px solid var(--ink);margin-top:14px;padding-top:12px;font-size:15px}
.call b.h{color:var(--red);letter-spacing:.05em;font-size:11.5px;display:block;margin-bottom:5px}

ul.sig{list-style:none;padding:0;margin:0}
ul.sig li{border-bottom:1px solid var(--line);padding:13px 0;font-size:15px}
ul.sig li:last-child{border-bottom:0}
ul.sig .src{display:block;color:var(--lite);font-size:12.5px;margin-top:4px}

/* quant panel */
.panel{border:1px solid var(--line);border-radius:8px;padding:22px;margin-bottom:18px}
.hero{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:4px}
.hero .n{font-size:52px;font-weight:800;letter-spacing:-.02em;line-height:1;
  font-variant-numeric:tabular-nums}
.hero .z{font-size:15px;font-weight:700;color:var(--red)}
.hero .dlt{font-size:13.5px;color:var(--mid);font-variant-numeric:tabular-nums}
.cap{font-size:12.5px;color:var(--lite);margin:2px 0 20px}
.ctitle{font-size:13px;font-weight:700;letter-spacing:.04em;margin:0 0 3px}
.csub{font-size:12.5px;color:var(--lite);margin:0 0 14px}

table.bars{width:100%;border-collapse:collapse;font-size:13.5px}
table.bars td{padding:7px 0;vertical-align:middle}
table.bars td.lab{width:34%;padding-right:12px}
table.bars td.lab small{display:block;color:var(--lite);font-size:11px}
table.bars td.bar{width:43%}
table.bars td.val{width:23%;text-align:right;font-variant-numeric:tabular-nums;
  color:var(--mid);font-size:12.5px;padding-left:10px}
table.bars td.val b{color:var(--ink);font-size:14.5px}
.track{background:var(--track);border-radius:4px;height:14px}
.fill{background:var(--red);border-radius:4px;height:14px;transition:width .3s}
.fill.z{background:var(--lite)}
table.bars tr:hover .fill{background:var(--red-d)}

/* trend small multiples */
.sm{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:14px;margin-top:8px}
@media(max-width:640px){.sm{grid-template-columns:repeat(2,1fr)}}
.sm figure{margin:0;border:1px solid var(--line);border-radius:6px;padding:12px 13px}
.sm figcaption{font-size:11.5px;color:var(--lite);margin:0 0 2px;letter-spacing:.03em}
.sm .now{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.2}
.sm .chg{font-size:11.5px;color:var(--mid);font-variant-numeric:tabular-nums}
.sm svg{display:block;width:100%;height:34px;margin-top:6px;overflow:visible}
.sm .v2,.csub .v2{display:inline-block;font-size:9.5px;font-weight:700;letter-spacing:.04em;
  padding:1px 4px;border-radius:3px;background:var(--red);color:#fff;vertical-align:1px}
.quad{display:flex;gap:22px;align-items:baseline;flex-wrap:wrap;margin-top:6px}
.quad span{font-size:12.5px;color:var(--mid)}
.quad b{font-size:22px;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums;
  margin-right:4px}
.quad .rg{font-size:13px;font-weight:700;color:var(--red);margin-left:auto}
.empty{border:1px dashed var(--line);border-radius:6px;padding:16px;
  color:var(--lite);font-size:13.5px;text-align:center}

footer{margin-top:56px;border-top:1px solid var(--line);padding-top:22px;
  color:var(--lite);font-size:13px;line-height:1.8}
footer b{color:var(--mid)}
.warn{background:var(--warn-bg);border:1px solid var(--warn-bd);border-radius:6px;
  padding:14px 16px;margin:16px 0 0;color:var(--warn-ink);font-size:13.5px}
.warn ul{margin:6px 0 0;padding-left:18px}
code{background:var(--soft);padding:1px 5px;border-radius:3px;font-size:12.5px}
.load{padding:60px 0;text-align:center;color:var(--lite)}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="load">載入中⋯</div></div>

<script>
const CB = () => '?v=' + Date.now();
const esc = s => String(s == null ? '' : s);
const el = (h) => { const t = document.createElement('template'); t.innerHTML = h.trim(); return t.content; };

async function getJSON(p){ const r = await fetch(p + CB(), {cache:'no-store'});
  if(!r.ok) throw new Error(p + ' ' + r.status); return r.json(); }

/* ---------- small-multiple sparkline: single series, 2px line, last point labelled ---------- */
function spark(vals){
  if(!vals || vals.length < 2) return '';
  const W = 100, H = 34, P = 3;
  const mn = Math.min(...vals), mx = Math.max(...vals);
  const span = (mx - mn) || 1;
  const pts = vals.map((v,i) => {
    const x = P + (W - 2*P) * (vals.length === 1 ? 0 : i/(vals.length-1));
    const y = P + (H - 2*P) * (1 - (v - mn)/span);
    return [x, y];
  });
  const dd = pts.map((p,i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
  const last = pts[pts.length-1];
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img"
      aria-label="走勢，最新值 ${vals[vals.length-1]}">
    <path d="${dd}" fill="none" stroke="var(--red)" stroke-width="2"
      vector-effect="non-scaling-stroke" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="2.6"
      fill="var(--red)" stroke="var(--bg)" stroke-width="2" vector-effect="non-scaling-stroke"/>
  </svg>`;
}

function fmtDelta(d){
  if(d === 0 || d == null) return '持平';
  return (d > 0 ? '＋' : '−') + Math.abs(d).toFixed(1);
}

/* ---------- renderers ---------- */
function renderTrend(index){
  const iss = [...index.issues].sort((a,b) => a.date.localeCompare(b.date));
  if(iss.length < 2){
    return `<div class="ctitle">跨期趨勢</div>
      <div class="csub">每一期的量化底盤都會被保留，累積兩期以上後這裡會顯示走勢。</div>
      <div class="empty">目前僅 ${iss.length} 期。下一期發布後即開始繪製。</div>`;
  }
  // 資料來源全部是 index.json 的量化快照。每期都必須寫齊，漏一個這裡就靜靜地少一條線。
  //
  // AI 泡沫監控在 2026-08-04 由 v1（六維 D1–D6）改版為 v2（三層 L1–L3），
  // 兩者的分群邏輯不同（一個按主題、一個按資料更新頻率），**不可互相換算**。
  // 所以趨勢分兩組畫：
  //   CONT — 跨版本定義未變，全期連續
  //   V2   — 只取 quantVer==='v2' 的期別，從改版後重新起算，並在圖上標明
  const CONT = [
    {n:'綜合泡沫溫度', get:i => i.composite},
    {n:'泡沫階段', get:i => i.stage},
    {n:'台股熱度', get:i => i.twHeat}
  ];
  const V2 = [
    {n:'L1 市場與情緒', get:i => i.dims && i.dims.L1},
    {n:'L2 資金與信用', get:i => i.dims && i.dims.L2},
    {n:'L3 基本面兌現', get:i => i.dims && i.dims.L3},
    {n:'象限 · 熱度', get:i => i.quadrant && i.quadrant.heat},
    {n:'象限 · 支撐', get:i => i.quadrant && i.quadrant.support}
  ];
  const v2iss = iss.filter(i => i.quantVer === 'v2');
  const card = (d, rows, tag) => {
    const vals = rows.map(d.get).filter(v => typeof v === 'number');
    if(vals.length < 2) return '';
    const now = vals[vals.length-1], first = vals[0];
    return `<figure title="${d.n}：${first.toFixed(1)} → ${now.toFixed(1)}">
      <figcaption>${d.n}${tag ? ' <span class="v2">'+tag+'</span>' : ''}</figcaption>
      <div class="now">${now.toFixed(1)}</div>
      <div class="chg">${tag ? '自 v2 起' : '自第一期'} ${fmtDelta(+(now-first).toFixed(1))}</div>
      ${spark(vals)}
    </figure>`;
  };
  const cards = CONT.map(d => card(d, iss, '')).join('')
              + V2.map(d => card(d, v2iss, 'v2')).join('');
  const legacy = iss.length - v2iss.length;
  return `<div class="ctitle">跨期趨勢</div>
    <div class="csub">共 ${iss.length} 期。每格為獨立小圖（各自縮放），只比較方向不比較高低。${
      legacy ? `<br><b>監控庫 2026-08-04 由六維改為三層，兩種分群不可換算。</b>
      前 ${legacy} 期為舊架構，層分數與象限自改版後重新起算（標 <span class="v2">v2</span>）；
      綜合溫度、泡沫階段、台股熱度三項定義未變，全期連續。` : ''}</div>
    <div class="sm">${cards}</div>`;
}

function renderQuant(q){
  if(!q) return '';
  // schemaVer 標的是「這期讀到的監控庫是哪個架構」：v1＝六維 D1–D6，v2＝三層 L1–L3。
  // 舊期沒有這個欄位，就依 dims 長度推回去。
  const v2 = q.schemaVer === 'v2' || (!q.schemaVer && q.dims.length === 3);
  const rows = q.dims.map(d => {
    // 最小寬度是無條件的安全網（值為 0 時長條不會整條消失）；
    // zeroish 只負責把長條改成灰色，表示「這一維目前接近 0，不要當成訊號」。
    const w = Math.max(d.v, 1.2);
    return `<tr title="${d.name} ${d.v}，本期變動 ${fmtDelta(d.delta)}">
      <td class="lab">${d.emph ? '<b>'+d.name+'</b>' : d.name}
        <small>權重 ${d.w}｜${d.note}</small></td>
      <td class="bar"><div class="track">
        <div class="fill${d.zeroish ? ' z' : ''}" style="width:${w}%"></div></div></td>
      <td class="val"><b>${d.v.toFixed(1)}</b><br>${fmtDelta(d.delta)}</td>
    </tr>`;
  }).join('');
  return `<div class="panel">
    <div class="hero">
      <span class="n">${q.composite.toFixed(1)}</span>
      <span class="z">${q.zone}</span>
      <span class="dlt">${q.note || ''}</span>
    </div>
    <div class="cap">綜合泡沫溫度．${v2 ? '三層加權' : '六維加權'}．泡沫階段 ${q.stage.current}（${q.stage.label}，點亮 ${q.stage.lit}，${q.stage.delta}）${
      typeof q.twHeat === 'number' ? `．台股熱度 <b>${q.twHeat.toFixed(1)}</b>` : ''}</div>
    ${q.quadrant ? `<div class="ctitle">象限定位</div>
      <div class="csub">熱度 ＝（L1＋L2）／2，市場與資金有多熱；支撐 ＝ 100 − L3，基本面還剩多少兌現空間。
        比單一綜合溫度多一個維度：同樣 60 分，有撐和沒撐是兩回事。</div>
      <div class="quad">
        <span><b>${q.quadrant.heat.toFixed(1)}</b> 熱度</span>
        <span><b>${q.quadrant.support.toFixed(1)}</b> 支撐</span>
        <span class="rg">${q.quadrant.regime}</span>
      </div>` : ''}
    <div class="ctitle">${v2 ? '三個層次（依資料更新頻率分層）' : '六個維度'}</div>
    <div class="csub">數值為 0–100 熱度，越高越熱。長條長度即為數值；右欄為本期變動。${
      v2 ? '' : '<br><b>本期為 2026-08-04 改版前的舊架構（六維）</b>，與之後的三層不可直接比較。'}</div>
    <table class="bars">${rows}</table>
    ${q.callout ? `<div class="call" style="margin-top:22px">
      <b class="h">${q.callout.h}</b>${q.callout.body}</div>` : ''}
  </div>`;
}

function renderItem(it){
  let h = `<div class="item${it.hot ? ' hot' : ''}">`;
  if(it.tags && it.tags.length)
    h += `<div class="tagrow">` + it.tags.map(t =>
      `<span class="tag${t.cls ? ' '+t.cls : ''}">${t.t}</span>`).join('') + `</div>`;
  if(it.title) h += `<h3>${it.title}</h3>`;
  if(it.body) h += it.body.map(p => `<p>${p}</p>`).join('');
  if(it.cols && it.cols.length)
    h += `<div class="cols n${it.cols.length}">` + it.cols.map(c =>
      `<div><h4>${c.h}</h4>${c.body}</div>`).join('') + `</div>`;
  if(it.list && it.list.length)
    h += `<ul class="sig">` + it.list.map(l =>
      `<li>${l.body}<span class="src">${l.src}</span></li>`).join('') + `</ul>`;
  if(it.evidence && it.evidence.length)
    h += `<div class="ev"><b class="h">佐證</b>` + it.evidence.map(e =>
      `<div><span class="d">${e.d}</span><span class="sb">${e.s}</span>${e.t}</div>`).join('') + `</div>`;
  if(it.call) h += `<div class="call"><b class="h">${it.call.h}</b>${it.call.body}</div>`;
  return h + `</div>`;
}

// 勘誤：既有單期檔永不改寫，所以事後發現的問題掛在 index.json 的期別項目上。
// 每一期的 errata 是選填字串陣列，有值才顯示橫幅。
function renderErrata(index, date){
  const me = index.issues.find(i => i.date === date);
  if(!me || !me.errata || !me.errata.length) return '';
  return `<div class="warn" style="margin:18px 0 0">
    <b>本期勘誤（發布後發現，原文保留未改寫）</b>
    <ul>${me.errata.map(e => `<li>${e}</li>`).join('')}</ul></div>`;
}

function renderIssue(d, index){
  const src = d.coverage.map(c => `<span>${c.k} · ${c.v}</span>`).join('');
  const btns = index.issues.map(i =>
    `<button data-file="${i.file}" data-date="${i.date}"
       aria-current="${i.date === d.date}">第 ${String(i.issue).padStart(3,'0')} 期 · ${i.short}</button>`).join('');

  let h = `<header>
      <div class="kicker">主題匯流訊號報</div>
      <h1>${d.headline}</h1>
      <div class="meta">${d.label}　·　${d.stamp}<br>
        量化涵蓋 <b>${d.range.quant}</b>　·　敘事涵蓋 <b>${d.range.narrative}</b></div>
      <div class="srcs">${src}</div>
    </header>
    <div class="switch"><span class="lbl">期別</span>${btns}</div>
    ${renderErrata(index, d.date)}
    <div class="verdict"><h2>本期判斷</h2>${d.verdict.map(p => `<p>${p}</p>`).join('')}</div>

    <h2 class="sec">零 · 量化底盤：這一節不是新聞，是這段期間的客觀狀態</h2>
    <p class="lede">新聞與 podcast 都是敘事，兩者可能一起錯；泡沫監控是每交易日自動抓 FRED、EDGAR、價格與 CAPE 算出來的，它不看新聞。把它放進來，等於多了一個不會被敘事帶著走的參照點。</p>
    ${renderQuant(d.quant)}
    <div class="panel">${renderTrend(index)}</div>`;

  // 「零」由外殼寫死（量化底盤）；中間各節由 d.sections 驅動，
  // 編號寫在各節自己的 title 字串裡（「一 ·」開始）。
  // 尾巴兩節（下週該盯什麼／回饋）的編號**依 sections 長度動態計算**，
  // 這樣 4 節（第 001 期）與 5 節（v0.5 起，多了圖表側寫）都不會錯位。
  h += d.sections.map(s => `<h2 class="sec">${s.title}</h2>` +
    (s.lede ? `<p class="lede">${s.lede}</p>` : '<div style="height:14px"></div>') +
    s.items.map(renderItem).join('')).join('');

  const CN = ['零','一','二','三','四','五','六','七','八','九','十'];
  const nSec = d.sections.length;
  const numWatch = CN[nSec + 1] || String(nSec + 1);
  const numFb    = CN[nSec + 2] || String(nSec + 2);

  h += `<h2 class="sec">${numWatch} · 下週該盯什麼（每一條都可觀察、可證偽）</h2><div style="height:14px"></div>
    <div class="item"><ul class="sig">${d.watch.map(w => `<li>${w}</li>`).join('')}</ul></div>`;

  if(d.feedback && d.feedback.length)
    h += `<h2 class="sec">${numFb} · 這期發現的、該回饋給來源系統的事</h2><div style="height:14px"></div>
      <div class="item"><ul class="sig">${d.feedback.map(w => `<li>${w}</li>`).join('')}</ul></div>`;

  h += `<footer>
      <b>資料來源與方法</b><br>
      四個公開資料集自動比對產生：投顧知識庫（advisory-knowledge-hub）、節目知識庫（podcast-knowledge-digest）、AI 泡沫監控（ai-bubble-monitor）、每日五圖（chart-of-the-day）。敘事側佐證逐字取自實際卡片、集數標題或當日交叉觀察，未經改寫；量化側數值直接取自 <code>data.json</code> 與圖表的重製序列。<br>
      前三庫在產生階段互不引用。<b>每日五圖的選題取自投顧知識庫，因此它與投顧側不算兩個獨立來源</b>——它在本報中的角色是量化側的第二個裁判：只有它自行重製的數字（Yahoo／FRED）才被當成證據。<br><br>
      <b>本期方法</b>：${d.about.method}<br><br>
      <b>執行紀錄</b>：${d.about.run}
      ${d.gaps && d.gaps.length ? `<div class="warn"><b>本期發現的資料缺口</b>
        <ul>${d.gaps.map(g => `<li>${g}</li>`).join('')}</ul></div>` : ''}
      <br>排程：每週日 21:30（台北）　·　歷史全部保留　·　本期發布 ${index.updatedLabel}
    </footer>`;
  return h;
}

async function load(file, index){
  const app = document.getElementById('app');
  app.innerHTML = '<div class="load">載入中⋯</div>';
  try{
    const d = await getJSON(file);
    app.innerHTML = renderIssue(d, index);
    app.querySelectorAll('.switch button').forEach(b =>
      b.addEventListener('click', () => {
        if(b.getAttribute('aria-current') === 'true') return;
        history.replaceState(null, '', '#' + b.dataset.date);
        load(b.dataset.file, index);
        window.scrollTo({top:0, behavior:'smooth'});
      }));
  }catch(e){
    app.innerHTML = '<div class="load">讀取失敗：' + e.message + '</div>';
  }
}

(async function(){
  try{
    const index = await getJSON('data/index.json');
    const want = location.hash.replace('#','');
    const hit = index.issues.find(i => i.date === want) || index.issues[0];
    await load(hit.file, index);
  }catch(e){
    document.getElementById('app').innerHTML =
      '<div class="load">無法讀取 data/index.json：' + e.message + '</div>';
  }
})();
</script>
